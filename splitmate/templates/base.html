<!DOCTYPE html>
<html lang="en" data-theme="{{ current_user.theme if current_user.is_authenticated and current_user.theme != 'system' else '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SplitMate keeps track of who paid for what in a group and works out the fewest payments that settle everyone up.">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-mark.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // Resolve the theme before first paint so the page never flashes the wrong one.
    (function () {
      var root = document.documentElement;
      var stored = null;
      try { stored = localStorage.getItem('splitmate-theme'); } catch (e) { /* private mode */ }
      var theme = root.getAttribute('data-theme') || stored;
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body{% block body_attrs %}{% endblock %}>
  {% block layout %}{% endblock %}

  <div class="flashes" id="flashes" role="status" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash flash-{{ category }}">
        <span class="grow">{{ message }}</span>
        <button type="button" aria-label="Dismiss" data-dismiss>&times;</button>
      </div>
      {% endfor %}
    {% endwith %}
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>

{# Inline SVG icon set. Self-hosted so the app has no CDN dependency. #}
{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"

  {%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
  {%- elif name == 'settings' -%}<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>

  {%- elif name == 'arrow-left' -%}<path d="M19 12H5M11 19l-7-7 7-7"/>

  {%- elif name == 'tag' -%}<path d="M20.6 13.4 12 4.8H4v8l8.6 8.6a2 2 0 0 0 2.8 0l5.2-5.2a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="8.5" r="1.2"/>

  {%- elif name == 'shield' -%}<path d="M12 3 5 6v6c0 4.4 2.9 8.3 7 9.5 4.1-1.2 7-5.1 7-9.5V6Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'scale' -%}<path d="M12 3v18M7 21h10"/><path d="M5 7h14"/><path d="m5 7-3 6h6ZM19 7l-3 6h6Z"/>
  {%- else -%}<circle cx="12" cy="12" r="9"/>
  {%- endif -%}
</svg>
{%- endmacro %}
